<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bilbycast — your feeds</title>
<style>
  /* Same palette as the player this page hands you off to (dvr.html), so
     opening a feed does not look like leaving the product. */
  :root {
    --bg: #0b0d10; --panel: #14181d; --line: #232a32;
    --fg: #e8edf2; --dim: #93a1b0; --accent: #37d3a6; --bad: #ff6b6d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--line);
    display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  header .who { color: var(--dim); font-size: 13px; }
  /* Pushed to the far end so it is never next to a Watch button — signing out
     by accident when you meant to watch is a bad five seconds. */
  header .spacer { flex: 1; }
  header a.signout {
    color: var(--dim); font-size: 13px; text-decoration: none;
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; min-height: 40px; display: inline-flex; align-items: center;
  }
  header a.signout:active { background: var(--panel); }
  main { max-width: 720px; margin: 0 auto; padding: 18px 16px 40px; }

  .feeds { display: flex; flex-direction: column; gap: 10px; }
  .feed {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px;
  }
  .feed .name { font-weight: 600; }
  /* 44px minimum, same reason as the player: this is used on a tablet. */
  .feed button {
    background: var(--accent); color: #05231b; border: 0; border-radius: 8px;
    padding: 11px 18px; font: inherit; font-weight: 700;
    min-height: 44px; cursor: pointer;
  }
  .feed button:active { filter: brightness(.92); }
  .feed button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .note { color: var(--dim); font-size: 13px; margin: 0 0 16px; }
  .msg {
    border-radius: 10px; padding: 14px 16px; font-size: 14px;
    background: var(--panel); border: 1px solid var(--line); color: var(--dim);
  }
  .msg.bad { border-color: #4a2326; color: var(--bad); }

  h2 { font-size: 15px; font-weight: 600; margin: 28px 0 8px; }
  /* Visible to a screen reader, not on screen: the actions column has no
     heading worth showing but still needs naming. */
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap;
  }

  /* Wide content scrolls inside its own box. The page itself must never
     scroll sideways — this is read on a phone as often as a desktop. */
  .tablewrap {
    overflow-x: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  }
  #cliptable { width: 100%; border-collapse: collapse; font-size: 14px; }
  #cliptable th, #cliptable td {
    text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  #cliptable thead th {
    font-size: 12px; font-weight: 600; color: var(--dim);
    text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
  }
  #cliptable tbody tr:last-child td { border-bottom: 0; }
  /* The name is the thing being scanned for, so it carries the weight and
     gets whatever width is left. */
  #cliptable td.name { font-weight: 600; }
  #cliptable td.feed { color: var(--dim); white-space: nowrap; }
  /* Sizes line up as a column of digits, so they compare at a glance. */
  #cliptable .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #cliptable td.act { white-space: nowrap; text-align: right; }
  #cliptable td.act > * + * { margin-left: 8px; }

  /* A row that is not finished says so in the size column, where the size
     would otherwise be — nothing else has to move. */
  #cliptable .pending { color: var(--dim); }
  #cliptable .failed { color: var(--bad); }
  #cliptable td.reason {
    color: var(--bad); font-size: 13px; padding-top: 0; border-bottom: 1px solid var(--line);
  }

  a.btn, button.btn {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--accent); color: #05231b; border: 0; border-radius: 8px;
    padding: 9px 14px; font: inherit; font-size: 13px; font-weight: 700;
    min-height: 40px; cursor: pointer; text-decoration: none;
  }
  a.btn:active, button.btn:active { filter: brightness(.92); }
  button.btn.quiet {
    background: transparent; color: var(--dim); border: 1px solid var(--line);
  }
  button.btn.quiet:hover { color: var(--fg); }
  button.btn:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Your feeds</h1>
  <span class="who" id="who"></span>
  <span class="spacer"></span>
  <a class="signout" id="signout" href="#" hidden>Sign out</a>
</header>
<main>
  <p class="note" id="note" hidden>
    Opening a feed gives you three hours of access to it. After that, come back
    here and open it again.
  </p>
  <div id="body"><div class="msg">Loading…</div></div>

  <!-- Only appears once there is something in it: a viewer who never exports
       a clip should not be shown an empty shelf every time they sign in. -->
  <section id="clips" hidden>
    <h2>Exports</h2>
    <p class="note">Exported from the Marks panel while watching. Kept for as
       long as the feed they came from, then removed with it.</p>
    <!-- A table, because these are rows of the same four facts and the eye
         should be able to run down any one of them. It scrolls inside its own
         box rather than pushing the page sideways on a phone. -->
    <div class="tablewrap">
      <table id="cliptable">
        <thead>
          <tr>
            <th scope="col">Clip</th>
            <th scope="col">Feed</th>
            <th scope="col" class="num">Size</th>
            <th scope="col"><span class="sr">Actions</span></th>
          </tr>
        </thead>
        <tbody id="cliplist"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="/portal.js"></script>
</body>
</html>
