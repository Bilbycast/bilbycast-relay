<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bilbycast — your feeds</title>
<style>
  /* Same palette as the player this page hands you off to (dvr.html), so
     opening a feed does not look like leaving the product. */
  :root {
    --bg: #0b0d10; --panel: #14181d; --line: #232a32;
    --fg: #e8edf2; --dim: #93a1b0; --accent: #37d3a6; --bad: #ff6b6d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--line);
    display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  header .who { color: var(--dim); font-size: 13px; }
  main { max-width: 720px; margin: 0 auto; padding: 18px 16px 40px; }

  .feeds { display: flex; flex-direction: column; gap: 10px; }
  .feed {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px;
  }
  .feed .name { font-weight: 600; }
  /* 44px minimum, same reason as the player: this is used on a tablet. */
  .feed button {
    background: var(--accent); color: #05231b; border: 0; border-radius: 8px;
    padding: 11px 18px; font: inherit; font-weight: 700;
    min-height: 44px; cursor: pointer;
  }
  .feed button:active { filter: brightness(.92); }
  .feed button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .note { color: var(--dim); font-size: 13px; margin: 0 0 16px; }
  .msg {
    border-radius: 10px; padding: 14px 16px; font-size: 14px;
    background: var(--panel); border: 1px solid var(--line); color: var(--dim);
  }
  .msg.bad { border-color: #4a2326; color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Your feeds</h1>
  <span class="who" id="who"></span>
</header>
<main>
  <p class="note" id="note" hidden>
    Opening a feed gives you three hours of access to it. After that, come back
    here and open it again.
  </p>
  <div id="body"><div class="msg">Loading…</div></div>
</main>
<script src="/portal.js"></script>
</body>
</html>
