<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DVR — __STREAM_ID__</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #14181d; --line: #232a32;
    --fg: #e8edf2; --dim: #93a1b0; --accent: #37d3a6; --live: #ff4d4f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    /* A tablet in a gallery or truck is often handled with one thumb. */
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  header { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .id { color: var(--dim); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #stage { position: relative; flex: 1; min-height: 0; background: #000; }
  #stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #proxy { display: none; }
  body[data-mode="shuttle"] #proxy { display: block; }
  body[data-mode="shuttle"] #main  { display: none; }
  #badge {
    position: absolute; top: 10px; left: 10px; padding: 3px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    background: #2a3038; color: var(--dim);
  }
  body[data-live="1"] #badge { background: var(--live); color: #fff; }
  #status { position: absolute; top: 10px; right: 10px; font-family: ui-monospace, Menlo, monospace;
            font-size: 11px; color: var(--dim); background: rgba(0,0,0,.55); padding: 3px 8px; border-radius: 6px; }
  #debug { display: none; position: absolute; left: 10px; top: 40px; margin: 0;
           font: 11px/1.45 ui-monospace, Menlo, monospace; color: #9ef;
           background: rgba(0,0,0,.75); padding: 8px 10px; border-radius: 6px;
           white-space: pre; pointer-events: none; }
  body[data-debug="1"] #debug { display: block; }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 14px 14px; }
  .timeline { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .timeline input[type=range] { flex: 1; min-width: 0; }
  .t { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--dim); min-width: 5.5em; }
  .t.right { text-align: right; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    background: #1c222a; color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; font-size: 14px; font-weight: 600;
    min-width: 44px; min-height: 44px; /* touch target */
    cursor: pointer;
  }
  button:active { background: #263039; }
  button[aria-pressed="true"] { background: var(--accent); color: #05231b; border-color: var(--accent); }
  button.live[aria-pressed="true"] { background: var(--live); color: #fff; border-color: var(--live); }
  button:disabled { opacity: .4; cursor: default; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  .grow { flex: 1; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 8px; }
  .err { color: #ffb4b4; font-size: 12px; margin-top: 8px; min-height: 1.2em; }
  @media (max-width: 560px) { .label-long { display: none; } }
</style>
</head>
<body data-mode="live" data-live="1">
<header>
  <h1>DVR</h1><span class="id">__STREAM_ID__</span>
</header>

<div id="stage">
  <video id="main" playsinline muted></video>
  <video id="proxy" playsinline muted></video>
  <div id="badge">live</div>
  <div id="status">—</div>
  <pre id="debug"></pre>
</div>

<footer>
  <div class="timeline">
    <span class="t" id="tPos">--:--:--</span>
    <input id="scrub" type="range" min="0" max="1000" value="1000" step="1" aria-label="Scrub">
    <span class="t right" id="tDur">--:--</span>
  </div>

  <div class="row">
    <button id="btnLive" class="live" aria-pressed="true" title="Jump to live">LIVE</button>
    <button id="btnPlay" title="Play">&#9654;</button>
    <button id="btnPause" title="Pause">&#10073;&#10073;</button>
    <button id="btnMute" aria-pressed="true" title="Unmute">&#128263;</button>
    <div class="sep"></div>

    <button data-jog="-1" title="Step back one frame">&#9664;|</button>
    <button data-jog="1" title="Step forward one frame">|&#9654;</button>
    <div class="sep"></div>

    <button id="btnRew" title="Rewind — click again for 4x, 8x, 16x">&#9664;&#9664;</button>
    <button data-rate="0.3333" title="Play at one third speed">33%</button>
    <button data-rate="0.5" title="Play at half speed">50%</button>
    <button data-rate="1" aria-pressed="true" title="Play at normal speed">100%</button>
    <button id="btnFf" title="Fast forward — click again for 4x, 8x, 16x">&#9654;&#9654;</button>
  </div>
  <div class="hint">
    Keys: <b>J</b>/<b>L</b> rewind/forward (press again to speed up) &middot;
    <b>K</b> stop &middot; <b>,</b>/<b>.</b> frame step &middot;
    <b>Space</b> play/pause &middot; <b>End</b> live
  </div>
  <div class="err" id="err"></div>
</footer>

<script src="/dvr/hls.js?v=__HLS_JS_VERSION__"></script>
<script>
(function () {
  "use strict";

  // The edge publishes two renditions of the same source. The main one is
  // long-GOP and carries the picture you actually watch; the proxy is
  // low-resolution and ALL-INTRA, which is what makes frame-exact seeking
  // possible at all — see WEB_DVR_PLAYER_PLAN.md.
  var STREAM = "__STREAM_ID__";
  var qs     = new URLSearchParams(location.search);
  var MAIN   = qs.get("main")  || STREAM;
  var PROXY  = qs.get("proxy") || (STREAM + "-proxy");
  // ONE token for both renditions.
  //
  // The player is two streams -- `{stream}` and `{stream}-proxy` -- but it is
  // one thing being watched, so it takes one credential. The relay's viewer
  // token covers a source and its derived renditions
  // (`token::verify_viewer_token`), which is what makes that work.
  //
  // Only needed when the origin is gated (`require_origin_token`), which is
  // off by default.
  // Remembered for the life of the TAB, because the line below deletes it
  // from the URL.
  //
  // Stripping it is right — a viewer copying the address bar should not hand
  // out their credential with it — but on its own it made the page a one-shot:
  // reload, press back, or let the browser restore the tab, and the URL that
  // comes back is the stripped one. The page then had no credential at all and
  // said "your viewing access has expired", which was not true and told the
  // viewer to fix the wrong thing. Confirmed in Chrome: first load 200s
  // throughout, reload 401s on the first manifest.
  //
  // `sessionStorage` is the right lifetime: per tab, gone when the tab closes,
  // never sent anywhere. It is wrapped because a browser with site data
  // blocked throws on access rather than returning null, and a viewer with
  // strict privacy settings should still be able to watch — they just lose the
  // reload.
  var TOKEN_KEY = "bilbycast.dvr.token." + STREAM;
  function rememberToken(t) {
    try { window.sessionStorage.setItem(TOKEN_KEY, t); } catch (e) { /* blocked */ }
  }
  function recallToken() {
    try { return window.sessionStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
  }
  function forgetToken() {
    try { window.sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* blocked */ }
  }

  var TOKEN = qs.get("token") || "";
  if (TOKEN) {
    rememberToken(TOKEN);
  } else {
    // A reload, a back-navigation, or a restored tab. The URL lost the token;
    // the tab did not.
    TOKEN = recallToken();
  }

  // With MSE we can send the token as a request header, so it never has to
  // sit in a URL -- out of the address bar, the history, and any Referer.
  // Native HLS (iOS Safari) hands the URL straight to the media stack and
  // cannot set headers, so there the query form is the only option.
  var TOKEN_IN_HEADER = !!(window.Hls && window.Hls.isSupported());
  if (qs.get("token") && window.history && history.replaceState) {
    qs.delete("token");
    var q = qs.toString();
    history.replaceState(null, "", location.pathname + (q ? "?" + q : "") + location.hash);
  }
  var FPS    = parseFloat(qs.get("fps") || "25");
  var dbg    = null;

  var main = document.getElementById("main");
  var proxy = document.getElementById("proxy");
  var scrub = document.getElementById("scrub");
  var tPos = document.getElementById("tPos");
  var tDur = document.getElementById("tDur");
  var status = document.getElementById("status");
  var errEl = document.getElementById("err");
  var btnLive = document.getElementById("btnLive");
  var btnPlay = document.getElementById("btnPlay");
  var btnPause = document.getElementById("btnPause");
  var btnMute = document.getElementById("btnMute");
  var btnRew = document.getElementById("btnRew");
  var btnFf = document.getElementById("btnFf");

  var mainHls = null, proxyAttached = false;
  // How far behind the seekable end "live" sits. Seeking to seekable.end
  // parks the playhead past the last decodable frame: the picture never
  // paints and hls.js reports bufferStalledError. Three target durations is
  // the LL-HLS hold-back convention.
  var LIVE_BACKOFF = 3;

  // Hysteresis for the LIVE badge.
  //
  // Live playback deliberately sits ~LIVE_BACKOFF behind the edge, and the
  // distance to that edge sawtooths by a whole segment: it jumps outward each
  // time a segment is appended, then closes again as playback advances
  // (measured swinging 1.06s -> 2.47s with 1 s segments). A single threshold
  // anywhere near the operating point therefore flips every second or so.
  //
  // Two thresholds instead: become live well inside the band, and only report
  // delayed once genuinely well outside it.
  var LIVE_ENTER = 6;    // within this of the edge => live
  var LIVE_LEAVE = 12;   // only past this do we admit to being behind
  var liveState = false;

  // Fast-forward / rewind cycle through these on repeated presses, then wrap.
  // They run on the shuttle path, not `playbackRate`: the loop presents every
  // Nth frame, so the seek rate stays ~fps/s at any speed instead of demanding
  // 16x the bandwidth and decode.
  var SHUTTLE_STEPS = [2, 4, 8, 16];


  // proxyTime = mainTime + timelineOffset.
  //
  // The two renditions are separate hls.js instances over separate playlists,
  // and hls.js zeroes each timeline at the first fragment *it* loaded. The
  // proxy attaches lazily, so its zero is a later instant than main's and the
  // two clocks are offset by a fixed amount — measured at 6 s when the proxy
  // was attached 2.5 s after load, 18 s when attached 13 s after. Without
  // correcting it every handover shows content from the wrong moment, which is
  // both invisible in the numbers and inconsistent between sessions.
  //
  // Both playlists track the same live edge, so the difference between their
  // seekable ends *is* that offset. It was measured constant to 0.00 s over
  // 80 s, so this is a fixed correction, not drift.
  var timelineOffset = 0;

  var mode = "live";     // live | scrub | jog | shuttle
  var rate = 1;          // transport rate; negative means reverse, |r|>1 shuttles
  /// Last rate chosen from the speed presets — the only rates that are valid
  /// as an `HTMLMediaElement.playbackRate`. Shuttle rates never land here.
  var playRate = 1;
  var scrubbing = false;
  var shuttleRAF = null;

  function url(stream, file) {
    var q = (TOKEN && !TOKEN_IN_HEADER) ? "?token=" + encodeURIComponent(TOKEN) : "";
    return "/origin/" + encodeURIComponent(stream) + "/" + file + q;
  }
  var lastHlsError = null;
  // Once access has expired, every later error is a consequence of it. Latch,
  // so a generic "network error" cannot overwrite the one message that tells
  // the viewer what to do.
  var accessExpired = false;

  // Substituted by the relay from its own config (pushed by the manager),
  // NEVER from a query parameter. This string becomes a link the page invites
  // the viewer to click, and one taken from the URL that asked for the page is
  // a phishing hop with extra steps. Empty when no portal is configured.
  var PORTAL_URL = "__PORTAL_URL__";

  function fail(msg) {
    if (accessExpired && msg && msg.indexOf("expired") === -1) return;
    errEl.textContent = msg || "";
  }

  /* Access has run out, and what the viewer should do depends on how they got
   * here — which the player cannot know.
   *
   * A viewer who followed a revocable LINK can reload: the grant is still
   * valid and mints a fresh token. A viewer who came from the PORTAL cannot —
   * they were handed a token in this URL, so reloading re-presents the dead
   * one and nothing changes. Telling them to reload is telling them to do the
   * one thing that will not work.
   *
   * So: when a portal is configured, offer it. When one is not, say what
   * happened and where to go, without promising a reload that may not help. */
  /* Where to send someone who needs a fresh credential.
   *
   * Straight back to THIS feed, not the portal's front page: the portal knows
   * who they are, so recovering should be one tap rather than "find your feed
   * again". Falls back to the front page if the stream name would not survive
   * a URL, which it always should — the relay validates it — but a link built
   * by string concatenation gets checked. */
  function portalReturn() {
    if (!PORTAL_URL) return "";
    if (!/^[A-Za-z0-9][A-Za-z0-9_-]*$/.test(STREAM)) return PORTAL_URL;
    return PORTAL_URL.replace(/\/+$/, "") + "/watch?stream=" + encodeURIComponent(STREAM);
  }

  function failWith(lead, linkText, tailText) {
    accessExpired = true;
    errEl.textContent = "";
    errEl.appendChild(document.createTextNode(lead));
    var href = portalReturn();
    if (href) {
      var a = document.createElement("a");
      a.href = href;
      a.textContent = linkText;
      a.rel = "noopener";
      a.style.color = "inherit";
      errEl.appendChild(a);
      errEl.appendChild(document.createTextNode("."));
    } else {
      errEl.appendChild(document.createTextNode(tailText));
    }
  }

  /* The credential was REFUSED. It may have run out, or been withdrawn — the
   * relay answers both the same way on purpose, so this cannot say which.
   * Forget it either way: keeping a token the relay has just rejected is what
   * turns one refusal into a loop. */
  function failExpired() {
    forgetToken();
    failWith("Your viewing access has expired. ",
             "Sign in again to keep watching",
             "Open the feed again from wherever you got the link.");
  }

  /* There was no credential at all — this page was opened directly, or its
   * tab was restored after the stored one was cleared. Nothing expired, and
   * saying so would send the viewer to fix the wrong thing. */
  function failNoToken() {
    failWith("This page needs a viewing link. ",
             "Open the feed from the portal",
             "Open the feed from wherever you got the link.");
  }
  function fmt(t) {
    if (!isFinite(t) || t < 0) return "--:--:--";
    var h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = Math.floor(t % 60);
    var f = Math.floor((t % 1) * FPS);
    return (h ? String(h).padStart(2, "0") + ":" : "") +
           String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") + "." + String(f).padStart(2, "0");
  }

  // ── seekable window ────────────────────────────────────────────────────
  // The DVR depth is whatever the manifest lists, which is a server-side
  // sliding window. That is why a viewer can scrub back to before they
  // joined: nothing here depends on what this client has buffered.
  function range(v) {
    if (!v.seekable || v.seekable.length === 0) return null;
    return { start: v.seekable.start(0), end: v.seekable.end(v.seekable.length - 1) };
  }
  // ── audio ──────────────────────────────────────────────────────────────
  //
  // Both elements load muted, and must: a tablet refuses to autoplay an
  // unmuted element, so starting unmuted means starting not playing at all.
  // The operator opts in with a gesture, which is what the policy wants.
  //
  // Only `main` is ever audible. The proxy exists to be seeked at speed --
  // its audio would be a scrub artefact, and with both elements loaded it
  // would play *underneath* main rather than instead of it.
  var wantAudio = false;

  function applyAudio() {
    // Audible only when the operator asked for it AND main is the element on
    // screen. Shuttle hands over to the proxy, so audio drops out for the
    // duration and comes back on its own -- no second control to remember.
    main.muted = !(wantAudio && mode !== "shuttle");
    proxy.muted = true;
    btnMute.setAttribute("aria-pressed", wantAudio ? "false" : "true");
    btnMute.textContent = wantAudio ? "🔊" : "🔇";
    btnMute.title = wantAudio ? "Mute" : "Unmute";
  }

  btnMute.addEventListener("click", function () {
    wantAudio = !wantAudio;
    applyAudio();
    // Safari/iOS only honours volume changes inside the gesture that asked
    // for them, so nudge playback here rather than on the next tick.
    if (wantAudio && mode !== "shuttle" && main.paused && mode === "live") {
      main.play().catch(function () { /* autoplay refusal is not fatal */ });
    }
  });

  // Only shuttle runs on the proxy. Jog stays on the main rendition: an
  // operator stepping frames is examining them, and stepping is one seek, not
  // the ~fps/s a shuttle needs.
  function activeVideo() { return mode === "shuttle" ? proxy : main; }

  /// Index of the frame containing `t`.
  function frameIndexAt(t) { return Math.floor(t * FPS + 1e-6); }

  /// Midpoint of frame `i`.
  ///
  /// Seeking to a frame *boundary* is ambiguous — the browser may present
  /// either side of it, and accumulating `+= 1/fps` lands on boundaries every
  /// time. Measured against burnt-in timecode, that dropped roughly one step
  /// in three (255.04 -> :01, 255.08 -> :01, 255.12 -> :02). A midpoint names
  /// exactly one frame.
  function frameCentre(i) { return (i + 0.5) / FPS; }

  /// Samples of the raw offset measurement, newest last.
  var offsetSamples = [];
  var OFFSET_SAMPLES = 25;   // ~5 s at the render cadence

  /// Re-measure the offset between the two timelines.
  ///
  /// The raw signal is `proxy.seekable.end - main.seekable.end`. Both track the
  /// same live edge, but each end is quantised to *its own* segment boundary,
  /// so the difference sawtooths by up to a segment — and by a whole segment
  /// more when the two renditions use different segment durations, or when one
  /// has published a segment the other has not yet.
  ///
  /// The true offset is a constant, so take the **median** of a rolling window
  /// rather than the latest sample. A median rejects the periodic excursions a
  /// mean would smear, and settles on the value the measurement spends most of
  /// its time at.
  ///
  /// Only meaningful once the proxy has a real window; measuring while it is
  /// still filling its first fragments gives a value that is wrong and, before
  /// this was a median, then silently stuck.
  function measureTimelineOffset() {
    var m = range(main);
    var p = range(proxy);
    if (!m || !p) return;
    if (p.end - p.start < 5) return;

    offsetSamples.push(p.end - m.end);
    if (offsetSamples.length > OFFSET_SAMPLES) offsetSamples.shift();

    var sorted = offsetSamples.slice().sort(function (a, b) { return a - b; });
    timelineOffset = sorted[Math.floor(sorted.length / 2)];
  }

  /// Convert between the two clocks. Everything the operator sees — the
  /// timecode, the scrub bar — is expressed on main's, so the reading does not
  /// jump when the picture hands over.
  function toMainTime(t, el) { return el === proxy ? t - timelineOffset : t; }
  function fromMainTime(t, el) { return el === proxy ? t + timelineOffset : t; }

  /// A handover seek that has not been applied yet: `{ el, t }`.
  ///
  /// The proxy is attached lazily, so the first jog or shuttle hands over to
  /// an element with no metadata. Assigning `currentTime` then is silently
  /// dropped and it stays at 0. Everything that reads a position must go
  /// through `playhead()` rather than the element, or it will do arithmetic
  /// against 0 and wind away from where the operator actually is — then jump
  /// again when the deferred seek finally lands.
  var pendingSeek = null;

  /// Seek `v` to `mainT` — a position on **main's** clock — deferring until
  /// the element can accept a seek.
  ///
  /// The conversion happens here rather than at the call site because on first
  /// use the proxy is created moments earlier and has no seekable window yet,
  /// so the offset is not measurable and the correction would be a silent
  /// no-op. By apply-time the element has metadata and can be measured.
  function seekWhenReady(v, mainT) {
    if (!isFinite(mainT) || mainT <= 0) return;
    var apply = function () {
      measureTimelineOffset();
      var target = pendingSeek && pendingSeek.el === v ? pendingSeek.mainT : mainT;
      try { v.currentTime = fromMainTime(target, v); } catch (e) {}
      if (pendingSeek && pendingSeek.el === v) pendingSeek = null;
    };
    if (v.readyState >= 1 && v.seekable.length) {
      pendingSeek = null;
      apply();
      return;
    }
    pendingSeek = { el: v, mainT: mainT };
    v.addEventListener("loadedmetadata", apply, { once: true });
  }

  /// Where the transport *is*, in `v`'s own clock. While a handover seek is
  /// outstanding the element still reads its old position, so this reports the
  /// intended one instead.
  function playhead(v) {
    if (pendingSeek && pendingSeek.el === v) return fromMainTime(pendingSeek.mainT, v);
    return v.currentTime;
  }

  /// True while `v` has not yet taken the position handed to it.
  function awaitingSeek(v) {
    return !!(pendingSeek && pendingSeek.el === v);
  }

  // ── attach ─────────────────────────────────────────────────────────────
  function attach(video, stream, label) {
    var src = url(stream, "manifest.m3u8");
    if (window.Hls && window.Hls.isSupported()) {
      var hls = new Hls({
        // A DVR window is thousands of segments; let the player hold a
        // generous back buffer so short jogs never refetch.
        backBufferLength: 120,
        maxBufferLength: 30,
        lowLatencyMode: false,
        // Every manifest and segment fetch carries the credential. Applies to
        // both because hls.js routes them through the same hook.
        xhrSetup: function (xhr) {
          if (TOKEN_IN_HEADER && TOKEN) xhr.setRequestHeader("Authorization", "Bearer " + TOKEN);
        }
      });
      hls.on(Hls.Events.ERROR, function (_e, data) {
        if (!data) return;
        lastHlsError = label + ":" + data.details + (data.fatal ? " (fatal)" : "");

        // An expiring viewing token is the one failure a viewer can act on, so
        // it must not arrive as a generic stall.
        //
        // The token is short-lived on purpose — its TTL *is* the revocation
        // latency, since the relay's HMAC tokens cannot be recalled once
        // minted. Nothing renews it yet, so a long watch eventually starts
        // 401ing mid-stream and hls.js reports a network error like any other:
        // the picture simply stops, with a message that means nothing to the
        // person watching.
        //
        // What fixes it depends on how they arrived, so `failExpired` decides
        // rather than this branch asserting one of the two answers.
        var status = (data.response && data.response.code) || 0;
        if (status === 401 || status === 403) {
          // Having no credential and having one refused are different
          // problems with different fixes, and telling a viewer their access
          // "expired" when the page simply never had a token sends them to
          // fix the wrong thing.
          if (TOKEN) { failExpired(); } else { failNoToken(); }
          return;
        }

        if (data.fatal) {
          fail(label + ": " + data.type + " / " + data.details);
        } else if (data.details === "bufferStalledError") {
          // Usually means the playhead is sitting past what is buffered.
          // Nudge back to the live sync point rather than sitting black.
          if (video === main && mode === "live") goLive();
        }
      });
      hls.loadSource(src);
      hls.attachMedia(video);
      return hls;
    }
    if (video.canPlayType("application/vnd.apple.mpegurl")) {
      video.src = src; // Safari native HLS
      return null;
    }
    fail("This browser cannot play HLS (no MSE and no native support).");
    return null;
  }

  // ── mode switching ─────────────────────────────────────────────────────
  // Handoff is by PTS: whichever element takes over is positioned to the
  // one leaving, so the picture does not jump.
  function setMode(next) {
    if (mode === next) return;
    var from = activeVideo();
    var t = playhead(from);
    mode = next;
    document.body.dataset.mode = next;
    var to = activeVideo();
    if (to !== from) {
      // Hand over by *content*, not by number: the two elements do not share a
      // clock. The target travels on main's, and is converted when it lands.
      seekWhenReady(to, toMainTime(t, from));
    }
    if (next === "shuttle") { main.pause(); }
    else { proxy.pause(); stopShuttle(); }
    document.body.dataset.live = (next === "live") ? "1" : "0";
    btnLive.setAttribute("aria-pressed", next === "live" ? "true" : "false");
    // Mode decides which element is on screen, so it also decides what may be
    // heard -- shuttle mutes, and returning restores without asking again.
    applyAudio();
    syncRateButtons();
  }

  function liveTarget() {
    // hls.js knows the real live sync point (it accounts for HOLD-BACK and
    // what is actually buffered). Fall back to a fixed back-off from the
    // seekable end when playing native HLS.
    if (mainHls && typeof mainHls.liveSyncPosition === "number" && isFinite(mainHls.liveSyncPosition)) {
      return mainHls.liveSyncPosition;
    }
    var r = range(main);
    return r ? Math.max(r.start, r.end - LIVE_BACKOFF) : null;
  }

  function goLive() {
    stopShuttle();
    setMode("live");
    var t = liveTarget();
    // Only nudge if we are actually away from live; forcing a seek on every
    // call fights hls.js's own edge tracking and re-stalls the buffer.
    if (t !== null && Math.abs(main.currentTime - t) > 1) {
      try { main.currentTime = t; } catch (e) {}
    }
    rate = 1; main.playbackRate = 1;
    main.play().catch(function () {});
    syncRateButtons();
  }

  // ── jog ────────────────────────────────────────────────────────────────
  // One exact seek per step, on the MAIN rendition, at full resolution.
  //
  // The proxy exists for shuttle, not for this: measured against burnt-in
  // timecode, long-GOP stepping is frame-exact as long as the seek names a
  // frame *centre* (see `frameCentre`) — what broke stepping was landing on
  // frame boundaries, not the GoP. An operator stepping frames is examining
  // them, so they get the full-resolution picture.
  function jog(dir) {
    // A frame step is an instruction to stop and look, so it ends any shuttle
    // and hands the picture back to the main rendition.
    stopShuttle();
    rate = 1;
    // Leave live as well as shuttle: stepping means the operator has
    // positioned deliberately, and staying in `live` would let the
    // stall-recovery path yank the playhead to the edge mid-step.
    if (mode === "live" || mode === "shuttle") setMode("scrub");
    main.pause();
    proxy.pause();

    var base = awaitingSeek(main) ? playhead(main) : main.currentTime;
    var t = frameCentre(frameIndexAt(base) + dir);
    var r = range(main);
    if (r) t = Math.max(r.start, Math.min(r.end, t));
    main.currentTime = t;
    syncRateButtons();
    render();
  }

  // ── shuttle ────────────────────────────────────────────────────────────
  // Negative playbackRate is unimplemented in every browser, so reverse is
  // driven by stepping currentTime. The important property: the seek rate
  // stays ~FPS/s no matter the speed — at 8x we present every 8th frame,
  // not every frame. That is what keeps it sustainable on a tablet.
  function startShuttle(r) {
    ensureProxy();
    setMode("shuttle");
    proxy.pause();
    stopShuttle();
    rate = r;
    // Seed the clock inside the first callback, not here. The gap between
    // starting a shuttle and the first animation frame covers attaching the
    // proxy and seeking it, which can be hundreds of milliseconds — charging
    // that to the first delta threw the playhead forward before the speed
    // settled.
    var last = null;
    var step = function (now) {
      if (last === null) {
        last = now;
        shuttleRAF = requestAnimationFrame(step);
        return;
      }
      // Hold position until the handover seek lands, or the loop would wind
      // away from 0 and then jump when it does.
      if (awaitingSeek(proxy)) {
        last = now;
        shuttleRAF = requestAnimationFrame(step);
        return;
      }
      // Clamp so a stalled tab or a slow seek cannot produce one huge jump.
      var dt = Math.min((now - last) / 1000, 0.25);
      last = now;
      var rng = range(proxy);
      var t = proxy.currentTime + rate * dt;
      if (rng) {
        if (t <= rng.start) { t = rng.start; stopShuttle(); }
        if (t >= rng.end)   { stopShuttle(); goLive(); return; }
      }
      try { proxy.currentTime = t; } catch (e) { /* mid-load */ }
      render();
      if (shuttleRAF !== null) shuttleRAF = requestAnimationFrame(step);
    };
    shuttleRAF = requestAnimationFrame(step);
  }
  function stopShuttle() {
    if (shuttleRAF !== null) { cancelAnimationFrame(shuttleRAF); shuttleRAF = null; }
  }


  function setRate(r) {
    fail("");
    // A shuttle rate is a SEEK rate, and it is one in both directions. Routing
    // only the negative ones to the shuttle left `setRate(+4)` — which is what
    // releasing the scrub bar mid-fast-forward asks for — assigning 4 to
    // `main.playbackRate` and playing the feed at four times real speed.
    if (r < 0 || Math.abs(r) > 1) { startShuttle(r); syncRateButtons(); return; }
    stopShuttle();
    if (mode === "shuttle") setMode("scrub");
    rate = r;
    playRate = r;
    main.playbackRate = r;
    main.play().catch(function () {});
    syncRateButtons();
  }
  function syncRateButtons() {
    var shuttling = mode === "shuttle";
    document.querySelectorAll("[data-rate]").forEach(function (b) {
      var on = !shuttling && parseFloat(b.dataset.rate) === rate;
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    // The active shuttle speed lives on the button, so the operator can see
    // where they are in the cycle without a separate readout.
    var rewOn = shuttling && rate < 0;
    var ffOn = shuttling && rate > 0;
    btnRew.setAttribute("aria-pressed", rewOn ? "true" : "false");
    btnFf.setAttribute("aria-pressed", ffOn ? "true" : "false");
    btnRew.textContent = rewOn ? "\u25C0\u25C0 " + Math.abs(rate) + "\u00D7" : "\u25C0\u25C0";
    btnFf.textContent = ffOn ? "\u25B6\u25B6 " + rate + "\u00D7" : "\u25B6\u25B6";
    // A shuttle counts as running even though the element is paused: the loop
    // is driving currentTime itself.
    var running = mode === "shuttle" || !activeVideo().paused;
    btnPlay.setAttribute("aria-pressed", running ? "true" : "false");
    btnPause.setAttribute("aria-pressed", running ? "false" : "true");
  }

  /// Step to the next speed in the cycle for `dir` (-1 rewind, +1 forward).
  /// Coming from anything that is not already shuttling that way — normal
  /// play, or shuttling the other direction — starts at the bottom.
  function cycleShuttle(dir) {
    var next;
    if (mode === "shuttle" && Math.sign(rate) === dir) {
      var i = SHUTTLE_STEPS.indexOf(Math.abs(rate));
      next = SHUTTLE_STEPS[(i + 1) % SHUTTLE_STEPS.length];
    } else {
      next = SHUTTLE_STEPS[0];
    }
    startShuttle(dir * next);
    syncRateButtons();
  }

  // ── scrub bar ──────────────────────────────────────────────────────────
  // Holding the thumb freezes the picture on the frame under it. A drag is a
  // request to *look* at a position, not to keep running from the old one —
  // and leaving playback going also means every seek fights the playhead.
  // Releasing resumes at whatever transport rate is still selected.
  var resumeAfterScrub = null;

  function beginScrub() {
    if (scrubbing) return;
    scrubbing = true;
    var v = activeVideo();
    // A shuttle counts as playing whichever way it runs: it drives
    // `currentTime` itself and leaves BOTH elements paused, so asking the
    // element is the wrong question. Testing `rate < 0` caught only reverse —
    // scrubbing during a forward shuttle resumed nothing, leaving the
    // transport dead and the picture on the paused low-res proxy.
    resumeAfterScrub = {
      playing: !v.paused || shuttleRAF !== null,
      rate: rate,
    };
    stopShuttle();
    v.pause();
    if (mode === "live") setMode("scrub");
    syncRateButtons();
  }

  function endScrub() {
    if (!scrubbing) return;
    scrubbing = false;
    var st = resumeAfterScrub;
    resumeAfterScrub = null;
    if (st && st.playing) {
      setRate(st.rate);   // restarts the shuttle loop when the rate is negative
    } else {
      syncRateButtons();
    }
  }

  scrub.addEventListener("pointerdown", beginScrub);
  scrub.addEventListener("input", function () {
    var v = activeVideo();
    // The bar is calibrated on main's clock (see `render`), so pick the
    // position there and convert for whichever element is showing.
    var r = range(main);
    if (!r) return;
    if (mode === "live") setMode("scrub");
    var t = r.start + (r.end - r.start) * (scrub.value / 1000);
    pendingSeek = null;   // the operator is choosing a position explicitly
    try { v.currentTime = fromMainTime(t, v); } catch (e) {}
    tPos.textContent = fmt(t - r.start);
  });
  // Release is caught on the window, not the input: dragging off the track
  // (easy with a thumb on a tablet) still ends the scrub.
  window.addEventListener("pointerup", endScrub);
  window.addEventListener("pointercancel", endScrub);
  scrub.addEventListener("change", endScrub);

  // ── render loop ────────────────────────────────────────────────────────
  /// Latch the live/delayed state with hysteresis, so a distance hovering
  /// near the boundary does not flap the badge.
  function updateLiveState(distance) {
    if (mode !== "live") {
      liveState = false;
      return;
    }
    if (liveState) {
      if (distance > LIVE_LEAVE) liveState = false;
    } else if (distance < LIVE_ENTER) {
      liveState = true;
    }
  }

  function render(remeasure) {
    var v = activeVideo();
    // Only from the 200 ms tick. `OFFSET_SAMPLES` is sized as "~5 s at the
    // render cadence"; sampling from the shuttle's requestAnimationFrame
    // instead fills the same 25 slots in about 0.4 s at 60 Hz, so the median
    // stops spanning a segment boundary and the handover offset chases the
    // sawtooth it exists to filter out.
    if (remeasure && proxyAttached) measureTimelineOffset();
    // Always present the window and the position on main's clock, so the
    // readout does not shift when the picture hands over to the proxy.
    var r = range(main);
    if (r) {
      var dur = r.end - r.start;
      var pos = toMainTime(playhead(v), v);
      tPos.textContent = fmt(pos - r.start);
      tDur.textContent = "-" + fmt(Math.max(0, r.end - pos)).replace(/\.\d+$/, "");
      if (!scrubbing && dur > 0) {
        scrub.value = String(Math.round(((pos - r.start) / dur) * 1000));
      }
      updateLiveState(r.end - pos);
      var atLive = liveState;
      document.body.dataset.live = atLive ? "1" : "0";
      document.getElementById("badge").textContent =
        mode === "shuttle" ? (rate > 0 ? rate + "x" : rate + "x") :
        atLive ? "live" : "delayed";
    }
    status.textContent = mode + " | " + (mode === "shuttle" ? "proxy" : "main") +
                         " | " + (rate > 0 ? rate + "x" : rate + "x");
    if (dbg) renderDebug();
  }

  // ── debug overlay (?debug=1) ───────────────────────────────────────────
  // A video that reports readyState 4, correct dimensions and rising frame
  // counts while showing nothing is a compositing/decoder problem, not a
  // stream problem. This makes that distinction visible without a console.
  function ranges(m) {
    var a = [];
    for (var i = 0; i < m.length; i++) a.push(m.start(i).toFixed(1) + "-" + m.end(i).toFixed(1));
    return a.join(",") || "-";
  }
  function renderDebug() {
    var v = activeVideo();
    var q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : null;
    dbg.textContent = [
      "mode=" + mode + "  rate=" + rate + "  element=" + (v === main ? "main" : "proxy"),
      "readyState=" + v.readyState + "  networkState=" + v.networkState + "  paused=" + v.paused,
      "videoWidth=" + v.videoWidth + "x" + v.videoHeight,
      "currentTime=" + v.currentTime.toFixed(2),
      "buffered=[" + ranges(v.buffered) + "]",
      "seekable=[" + ranges(v.seekable) + "]",
      "decodedFrames=" + (q ? q.totalVideoFrames : "n/a") +
        "  dropped=" + (q ? q.droppedVideoFrames : "n/a"),
      "mediaError=" + (v.error ? v.error.code + " " + v.error.message : "none"),
      "proxyAttached=" + proxyAttached +
        "  timelineOffset=" + timelineOffset.toFixed(2) + "s",
      "mainT=" + main.currentTime.toFixed(2) +
        "  proxyT=" + proxy.currentTime.toFixed(2) +
        "  (same instant when proxyT - mainT = offset)",
      "lastHlsError=" + (lastHlsError || "none"),
      "",
      "If decodedFrames is RISING but the picture is black, the stream is fine",
      "and the browser is not compositing it — try chrome://settings 'Use",
      "graphics acceleration when available' off, then reload.",
    ].join("\n");
  }
  setInterval(function () { render(true); }, 200);

  // ── controls ───────────────────────────────────────────────────────────
  btnLive.addEventListener("click", goLive);
  // Separate play and pause rather than one toggle: on a transport you press
  // the control you want, without first reading the button to find out what
  // it currently means.
  btnPlay.addEventListener("click", function () {
    stopShuttle();
    // `rate` is the transport rate, and a shuttle sets it to +/-2..16 — which
    // is a seek rate, not a playback rate. Handing that to `setRate` after a
    // forward shuttle would set `main.playbackRate = 16` and play the feed at
    // sixteen times real speed. Resume at the last rate the *presets* chose.
    setRate(playRate);
  });
  /// Stop the transport, whatever it was doing.
  ///
  /// A shuttle leaves the media element *paused* while the loop drives
  /// `currentTime`, so "is the element paused?" is not the same question as
  /// "is the transport running?". A single toggle that asked the former
  /// needed two presses to stop a fast-forward: the first saw a paused
  /// element and started playback.
  ///
  /// Leaving shuttle mode also hands the picture back to the main rendition,
  /// so a stopped transport shows the full-resolution frame rather than the
  /// low-res proxy still.
  function pauseTransport() {
    stopShuttle();
    if (mode === "shuttle") setMode("scrub");
    rate = 1;
    main.pause();
    proxy.pause();
    syncRateButtons();
  }
  btnPause.addEventListener("click", pauseTransport);
  document.querySelectorAll("[data-jog]").forEach(function (b) {
    b.addEventListener("click", function () { jog(parseInt(b.dataset.jog, 10)); });
  });
  document.querySelectorAll("[data-rate]").forEach(function (b) {
    b.addEventListener("click", function () { setRate(parseFloat(b.dataset.rate)); });
  });
  btnRew.addEventListener("click", function () { cycleShuttle(-1); });
  btnFf.addEventListener("click", function () { cycleShuttle(1); });

  document.addEventListener("keydown", function (e) {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    switch (e.key) {
      case "j": cycleShuttle(-1); break;
      case "k": pauseTransport(); break;
      case "l": cycleShuttle(1); break;
      case ",": jog(-1); break;
      case ".": jog(1); break;
      case "End": goLive(); break;
      case " ":
        e.preventDefault();
        if (mode === "shuttle" || !activeVideo().paused) pauseTransport();
        else btnPlay.click();
        break;
      default: return;
    }
  });

  // ── start ──────────────────────────────────────────────────────────────
  if (qs.get("debug") === "1") {
    dbg = document.getElementById("debug");
    document.body.dataset.debug = "1";
  }
  mainHls = attach(main, MAIN, "main");
  // The proxy is NOT attached up front. Two live MSE elements hold two
  // decoders, and Chrome's hardware decoder budget is small and shared —
  // exhausting it makes the *visible* element play with no picture, which
  // looks exactly like a black stream. Attach on first jog/shuttle instead.
  function ensureProxy() {
    if (!proxyAttached) {
      proxyAttached = true;
      attach(proxy, PROXY, "proxy");
      // Sample the offset as soon as the proxy has a window, so the first
      // handover is not working from a single cold reading.
      proxy.addEventListener("loadedmetadata", function () {
        var n = 0;
        var t = setInterval(function () {
          measureTimelineOffset();
          if (++n >= OFFSET_SAMPLES) clearInterval(t);
        }, 60);
      }, { once: true });
    }
  }
  main.addEventListener("loadedmetadata", function () { goLive(); });
  main.addEventListener("playing", syncRateButtons);
  main.addEventListener("pause", syncRateButtons);
  // Put the mute button in the state the elements are actually in, rather
  // than trusting the markup and the script to agree.
  applyAudio();
  // The proxy is only ever a still frame source; never let it run on its own.
  proxy.addEventListener("play", function () { if (mode !== "shuttle") proxy.pause(); });
})();
</script>
</body>
</html>
