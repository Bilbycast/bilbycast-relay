name: CI

# The repo's first CI. Until now `nightly-release.yml` was the only workflow
# this repo has ever had — it triggers on `workflow_dispatch` and
# `push.tags: v*`, and its only build step is `cargo build --release`, which
# does not compile test targets. So no `cargo test`, no `cargo clippy` and no
# `cargo check --all-targets` had ever run automatically, and the first
# automated build of any change was the release build, *after* the tag was
# pushed. See issue #3.
#
# (The CodeQL runs visible on this repo come from GitHub's default
# code-scanning setup, not from a workflow file here, and CodeQL runs neither
# the test suite nor clippy.)
#
# This file sits BESIDE the release workflow and must not replace or rename it:
# `nightly-release.yml` is baked into the cosign `--certificate-identity-regexp`
# in that file, so renaming it invalidates every published `manifest.sig.bundle`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Both triggers are branch-scoped on purpose.
#
# An unfiltered `push` also fires on tag refs, so every `release-all.sh` run
# would spin this whole job up on the tag ref, racing the Release build for the
# same runner pool and the same repo cache. Scoping to `main` also removes the
# push/PR double-run for free: a PR branch push no longer matches `push`, so
# only `pull_request` runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deliberately narrower than the release workflow, which needs `contents: write`
# (it pushes tags) and `id-token: write` (it mints a Fulcio cert). CI needs
# neither, so a compromised action in this path cannot do either.
permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04

    env:
      # Nine cargo invocations (check/clippy/test across three feature configs)
      # share one target dir. Debug info is the dominant term in target-dir
      # size and link time, and nothing here debugs a CI binary — panics still
      # carry file and line, which is all the test output uses. bilbycast-manager
      # added this after `ld` died with SIGBUS on a full filesystem; this repo
      # is a single crate rather than a workspace plus npm plus Postgres, so it
      # is preventative here rather than a fix for an observed failure.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Registry dependencies are compiled with `--cap-lints allow`, so this
      # only promotes warnings in this crate's own code.
      RUSTFLAGS: "-D warnings"
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # A disjoint namespace from the release workflow on purpose. Release
          # uses the prefix `<target>-cargo-relay-` (a musl target,
          # release profile, LTO), and caches written on `main` are readable
          # from tag refs — so a shared prefix would drop this host-gnu dev
          # profile `target/` into a musl release build.
          key: ci-gnu-cargo-relay-${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-gnu-cargo-relay-

      # ---------------------------------------------------------------
      # Default features: the pure opaque forwarder.
      # ---------------------------------------------------------------
      - name: cargo check (default features)
        run: cargo check --all-targets

      # The accepted-lint set lives in `[lints.clippy]` in Cargo.toml, one
      # documented reason per entry — so this is `-D warnings` with no inline
      # `-A` flags to drift out of sync with the manifest.
      - name: cargo clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (default features)
        run: cargo test

      # ---------------------------------------------------------------
      # `viewer-distribution`: the WHEP SFU + LL-HLS/CMAF origin.
      #
      # This half is NOT optional coverage. The feature is off by default, so
      # every command above compiles right past `src/distribution/` — 12 files
      # and ~4.5k lines, including the whole WebRTC session and token surface.
      # Before this workflow existed, the only thing that ever built that code
      # was `cargo build --release --features viewer-distribution-vendored` in
      # the release job, which compiles no test targets and runs no lint. The
      # first run of this step found a test in there that had been failing
      # about one run in sixteen since it was written
      # (`tampered_signature_rejected`).
      #
      # Uses plain `viewer-distribution` rather than the release's
      # `viewer-distribution-vendored`: the two compile the same Rust, and the
      # vendored variant differs only by statically building OpenSSL, which
      # costs several minutes and proves nothing extra about this code.
      # ---------------------------------------------------------------
      - name: cargo check (viewer-distribution)
        run: cargo check --all-targets --features viewer-distribution

      - name: cargo clippy (viewer-distribution)
        run: cargo clippy --all-targets --features viewer-distribution -- -D warnings

      - name: cargo test (viewer-distribution)
        run: cargo test --features viewer-distribution

      # ---------------------------------------------------------------
      # `portal`: the viewer portal binary.
      #
      # Same argument as the block above, and the same trap: `portal` is off by
      # default, and it is a SECOND binary with `required-features`, so every
      # command above compiles right past `src/portal/`, `src/portal_bin.rs`
      # and `tests/portal.rs` without so much as a syntax check. The code it
      # covers is the trust boundary between an authenticating proxy and the
      # manager's entitlement store, which is the last thing that should first
      # be compiled by a release build.
      #
      # A separate config rather than folded into the line above: the portal is
      # deliberately independent of `viewer-distribution` (it links neither
      # str0m nor OpenSSL), and running them together would stop proving that.
      # ---------------------------------------------------------------
      - name: cargo check (portal)
        run: cargo check --all-targets --features portal

      - name: cargo clippy (portal)
        run: cargo clippy --all-targets --features portal -- -D warnings

      - name: cargo test (portal)
        run: cargo test --features portal

      # `install-relay.sh` and `upgrade-relay.sh` are 400 lines of
      # download-and-verify that only ever run for real, against a signed
      # release, on somebody's server. Nothing here could execute them — so the
      # portal blocks added to both are exercised on staged tarballs instead:
      # does the installer find the binary, refuse the lean tarball, decline to
      # clobber an existing config, and does the upgrader recognise an
      # installed portal from its unit. Shell that is only ever run for real is
      # shell nobody has tested.
      - name: Packaging scripts parse
        run: |
          bash -n packaging/install-relay.sh
          bash -n packaging/upgrade-relay.sh
          bash -n packaging/uninstall-relay.sh

      - name: Portal install/upgrade logic
        run: bash packaging/test-portal-install.sh
