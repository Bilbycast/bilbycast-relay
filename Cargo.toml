[package]
name = "bilbycast-relay"
version = "0.20.0"
edition = "2024"
description = "QUIC relay server for bilbycast IP tunneling between NAT'd edge nodes"
license = "AGPL-3.0-or-later"

[lints.clippy]
# Each entry is a deliberate exemption with a reason — do not add one to
# silence a lint you have not looked at. Mirrors the policy blocks in
# bilbycast-edge and bilbycast-manager, and the first three entries are
# adjudicated the same way there.

# Would add `Default` impls that nothing constructs, i.e. dead code — which the
# project bar forbids outright. Both sites (`TunnelStats`, `RelayStats`) are
# built by `new()` at startup and never defaulted. Same call as edge/manager.
new_without_default = "allow"
# Wants `if denom == 0 { 0 } else { numer * 90_000 / denom }` rewritten as
# `checked_div` + `if let`. The guard states "the RTP clock rate is not known
# yet", which is the condition a reader of the WHIP ingest path cares about —
# not "this division might trap". Same reasoning as edge's entry.
manual_checked_ops = "allow"
# Fires on the axum handler-helper shape `Result<(), Response>`, where the
# `Err` variant *is* the HTTP response that gets returned to the client. That
# is the idiomatic axum form; boxing it would add an allocation and an unbox at
# every call site to satisfy a size heuristic aimed at ordinary error enums.
result_large_err = "allow"

[dependencies]
# QUIC
quinn = "0.11.12"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
rcgen = "0.14.10"

# Async runtime
tokio = { version = "1.54.1", features = ["full"] }

# Direct socket-option control for IPV6_V6ONLY on dual-stack QUIC + REST listeners.
socket2 = "0.6.5"

# HTTP API
axum = "0.8.9"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# CLI
clap = { version = "4.6.9", features = ["derive"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Concurrency
# PINNED to a release candidate on purpose, and the version number is
# misleading: the 7.0 line is STALLED, not merely unreleased. 7.0.0-rc2 was
# published 2025-03-05, there has never been an rc3, and upstream went on to
# publish stable 6.2.1 on 2026-05-17 — fourteen months LATER. No fix will ever
# land on rc2, and an advisory against it would have no upgrade path. It is NOT
# drift; do not "refresh" it to 6.2.1 without doing the attached work.
#
# The requirement is `=7.0.0-rc2`, EXACT, and that matters: a caret on a
# prerelease crosses to later prereleases of the same base version, so plain
# "7.0.0-rc2" would take an rc3 or a 7.0.0 final on the next `cargo update`
# — the routine bump procedure this monorepo uses, since dependabot's cargo
# ecosystem is deliberately off — and land it in the hot-path registries with
# no review. Nothing in [7.0.0-rc2, 8.0.0) has been published since
# 2025-03-05, but the range would have taken it silently.
#
# Reverting to 6.2.1 is API-clean for our usage — every call site is `DashMap`,
# `DashMap::new` or `Entry`, both versions re-export Entry/OccupiedEntry/
# VacantEntry at the crate root, what 7.0 removed (the `Map` trait and
# `SharedValue` — `raw-api` is declared in BOTH versions and was not removed)
# appears nowhere here, and no manifest declares a dashmap feature. The lookup
# bounds on get/remove/contains_key/remove_if do differ — `K: Borrow<Q>, Q:
# Hash + Eq` in 6.2.1 against `Q: Hash + Equivalent<K>` in rc2 — which is
# compile-compatible for our keys only because `equivalent`'s single impl is
# the Borrow blanket. A revert also drags hashbrown 0.14.5 and once_cell into
# three graphs that carry no 0.14.x, and steps back to edition 2018 / MSRV
# 1.65. What stops it being a free swap is that 7.0
# replaced hashbrown's RawTable with HashTable internally, and these maps are
# the lock-free hot-path registries of Key Design Constraints #1/#2. Bench the
# registries before moving, in edge, manager and relay together.
dashmap = "=7.0.0-rc2"

# WebSocket client (manager connection)
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
chrono = { version = "0.4.45", features = ["serde"] }

# Utilities
uuid = { version = "1.29.3", features = ["v4", "serde"] }
anyhow = "1.0.104"
bytes = "1.12.2"

# Certificate pinning (SHA-256 fingerprint)
sha2 = "0.11.1"
webpki-roots = "1.0.12"

# Lock-free cell used by the always-compiled `distribution_control` module (the
# runtime config the manager pushes over WS) + the per-stream keyframe cache.
# Non-optional so the manager-client command handler can hold a
# `DistributionControl` handle without a feature gate. Tiny crate.
arc-swap = "1.9.5"

# ── Viewer distribution subsystem (feature: viewer-distribution, default OFF) ──
# A stateful, media-terminating WHEP SFU + LL-HLS origin co-located in the relay
# binary but hard-isolated from the stateless opaque forwarder. Only pulled in
# when the operator opts a relay into the "distribution" role. The WebRTC stack
# is str0m (same as bilbycast-edge) with the OpenSSL DTLS backend — the pure-Rust
# dimpl DTLS stalls on localhost active↔passive handshakes (see edge Cargo.toml).
[dependencies.str0m]
# 0.26.0, moved in lockstep with bilbycast-edge (both ends of a WHEP session
# must agree). The lockfile moves `str0m` 0.24.1 -> 0.26.0, `is` 0.11.1 ->
# 0.12.1, `str0m-openssl` 0.6.0 -> 0.7.0, `str0m-proto` 0.7.0 -> 0.8.0 and
# `dimpl` 0.7 -> 0.9.0, and adds no crate: dimpl 0.9's dependencies were all
# in the graph already. MSRV rises from 1.85.0 to 1.89.0. The `openssl` /
# `vendored` features are unchanged and str0m-openssl 0.7.0 asks for the same
# openssl / openssl-sys, so `viewer-distribution-vendored` still unifies
# str0m's OpenSSL into the static build. Earlier steps are audited in
# bilbycast-edge/Cargo.toml; the last change before this one that needed code
# here was `MediaData.data` becoming `Arc<[u8]>` in 0.20.
#
# 0.24.1 -> 0.26.0 at compile time: one break. `set_reordering_timeout_video`
# is gone (#1078), so `rtc_config` no longer calls it. Every other builder,
# SDP, writer and event call in `distribution::{webrtc::session, whep,
# whip_ingest, cascade}` keeps its signature, and str0m's seven built-in H.264
# entries, Opus PT 111, the default extmap and the 1150-byte datagram target
# are unchanged — so is the codec set below.
#
# 0.24.1 -> 0.26.0 in behaviour:
# - Video receive reordering has no count-only mode any more (#1078). An
#   incomplete frame waits for a complete successor, then the missing
#   packets' NACK attempts, then three RTTs — or three RTTs from the
#   successor's receipt when the publisher negotiated no RTX, about 300 ms
#   until an RTT is measured — and is then dropped. 0.24.1 with the deadline
#   off released it once 30 complete frames had queued behind it (1.02 s
#   measured at 30 fps without RTX). Not re-measured on 0.26. A video frame
#   whose last packet carries no RTP marker bit is now never delivered: so an
#   H.264 WHIP publisher or cascade upstream that never sets the marker gets
#   no video through WHIP ingest or the cascade pull at all (Chrome, ffmpeg,
#   OBS and str0m set it; 0.24.1 delimited such frames on the timestamp
#   change). Audio keeps count-only release (`set_reordering_timeout_audio`).
# - SDP consistency is enforced on offers AND answers (#1100, #1097, #1113).
#   0.24.1 stopped its session-level check at the first consistent m-line;
#   0.26 refuses duplicate mids, a BUNDLE group whose mids do not match the
#   m-lines in number and order, and an RTX PT repairing two PTs, and reads
#   ICE and DTLS attributes from the m-line the BUNDLE group's first mid
#   names (#1158). So a third-party WHIP or WHEP offer 0.24.1 took can now
#   get a 400, and an upstream's answer it took can now fail a cascade pull.
#   The captured Chrome 124 and ffmpeg 8.1 offers pass; nothing else was
#   tried.
# - The negotiation panics the relay caught are gone: the offer with one RTX
#   PT repairing two PTs is refused while it is parsed (#1113), and a PT
#   claimed twice is warned about and ignored (#1159). `isolate_negotiation`
#   stays as defence in depth, so `webrtc_negotiation_panic` now fires only
#   for a panic nobody has found yet.
# - H.264 filler data NAL units are packetized and sent (#1079); 0.24
#   dropped them. A CBR source's filler would cost every WHEP viewer the full
#   CBR rate for bytes its decoder discards, so `WebrtcSession::write_media`
#   strips them first (`strip_h264_filler`), keeping 0.24's wire.
# - ICE-Lite nomination (is 0.12, #1168): nominations from the last 6 s rank
#   first, then PRIORITY, then recency, so a NAT port rebind is followed;
#   0.11.1 ranked by PRIORITY alone. `PeerPin` pins the IP only, so a port
#   rebind still passes it.
# - A rejected m-line is written `m=<media> 0 <proto> 0` (#1101), which a
#   browser and str0m can read; 0.24.1 wrote an empty format list.
# - NACK and RTX: per-packet NACK retries are paced by the RTT (#1070), a
#   NACKed packet is resent at most once per RTT (#1134), and RTX more than
#   128 sequence numbers behind the newest is dropped (#1089). TWCC feedback
#   to Chrome publishers is corrected (#1143, #1144, #1150, #1151, #1152),
#   which changes what their bandwidth estimate sees. Candidates and STUN
#   from port 0 or an unspecified IP are ignored (#1148).
# - `poll_output` skips redundant work behind a readiness flag (#1011) and
#   the NullPacer drains without a timeout (#1112, #1115), so the Transmit /
#   Timeout cadence the session loops see can differ.
#
# Not verified live: nothing above has been run against a real browser,
# ffmpeg or OBS peer, or across a 0.24 edge talking to a 0.26 relay (answers
# differ only in a rejected m-line now carrying format 0). The evidence is
# source reading, the suites in `tests/distribution.rs` (str0m at both ends)
# and offline SDP probes.
#
# Codec set. str0m 0.26.0's built-in H.264 entries are still level 3.1, so
# `WebrtcSession::new` re-registers them at level 5.1: Opus (no RED) plus those
# seven entries with the same PT, RTX PT, packetization mode and profile
# (`H264_LEVEL_5_1` in `webrtc/session.rs`), and no other codec. It used to
# keep str0m's whole default set and add four level-5.1 H.264 extras. Since
# 0.22 (#1016) an H.264 level mismatch only lowers the match score, so an
# offered PT matched a built-in entry and an extra alike; wherever the remote
# dictates the PTs (a recvonly or sendrecv offer, a recvonly answer to our
# sendonly offer) str0m up to 0.24 locked it twice and panicked ("Pt locked
# multiple times: 102") — every Chrome WHEP viewer. The default set also put
# VP8 first, so between two `WebrtcSession`s `get_pt` sent H.264 on PT 96,
# labelled VP8. What changes on the wire: answers list only the H.264 (+ RTX)
# PTs the offer gave H.264, with our level 5.1, and only Opus for audio; our
# offers list only those seven H.264 entries and Opus. bilbycast-edge
# registers the identical set, because its WHIP output negotiates with this
# crate's WHIP ingest. Tested in `tests/distribution.rs` against a captured
# Chrome 124 WHEP offer, a captured Chrome publisher offer, an ffmpeg
# 8.1-shaped WHIP offer and single-PT answers, and run live at 18cd89a (str0m
# 0.24.1) against HeadlessChrome 124 (edge WHIP -> relay -> Chrome WHEP, and
# Chrome WHIP -> relay -> Chrome WHEP).
#
# UPGRADE ORDER — this set and the old one do not interoperate both ways.
# Every earlier build (bilbycast-edge releases through v0.113.0 and edge trees
# before 5f71c4c; relay releases through v0.15.0) holds two entries for some
# (profile, mode) pairs, and str0m panics in it whenever this set's SDP
# dictates the PT for one of them: no answer shape avoids it, because one PT
# matches both old entries. An old edge's WHIP output panics applying this
# relay's answer ("Pt locked multiple times: 110") and its output task dies
# without retrying; an old upstream relay panics on a new downstream's cascade
# offer (": 127") and leaks a per-IP viewer slot on each 3 s retry. A new edge
# publishing to an old relay, and an old downstream pulling from a new
# upstream, both work. So upgrade WHIP-publishing edges first, then relays from
# the upstream end of each cascade. Operator copy: `docs/distribution.md`,
# "Upgrade order".
#
# KNOWN GAP, also predating this bump: unlike bilbycast-edge, this crate
# carries no `[patch.crates-io]` and no vendored `is`, so it builds against
# upstream's strict ICE parser — `is` 0.12.1 still refuses a Binding Request
# with no PRIORITY attribute (`stun.rs`, "STUN packet missing priority"). Its
# WHIP ingest therefore REJECTS such requests, which is what ffmpeg 8.0.x (n8.0
# to n8.0.3) sends. ffmpeg 8.1 and later send PRIORITY (upstream 7fd967c2c1)
# and are accepted. Vendoring a permissive parser here would also have to
# replace the unguarded `.expect("STUN request prio")` in `is`'s
# `stun_server_handle_message`, which such a request would then reach.
version = "0.26.0"
optional = true
default-features = false
features = ["openssl"]

# The viewer and ingest tokens (`distribution::token`) are HMAC-SHA256.
[dependencies.hmac]
version = "0.13.0"
optional = true

# The distribution HTTP surface's CORS layer (`distribution::build_router`).
[dependencies.tower-http]
version = "0.7.1"
optional = true
features = ["cors"]

[dependencies.tokio-util]
version = "0.7.20"
optional = true
# `io` is what turns a `tokio::fs::File` into a response body: a clip is up to
# 256 MiB and the origin must not hold one in memory to hand it out.
features = ["rt", "io"]

# Only pulled in by `viewer-distribution-vendored` (the release variant) to
# statically vendor OpenSSL — feature unification makes str0m's openssl-sys
# vendored too, so the static-musl release binary carries no runtime libssl
# dependency. Local dev uses plain `viewer-distribution` (system OpenSSL, fast).
[dependencies.openssl]
version = "0.10"
optional = true

# Portal account sync (`src/portal/accounts.rs`): reads and rewrites
# Authelia's YAML user file, and gives each new account an argon2id hash of a
# random secret nobody holds. `serde_yaml_ng` is the maintained fork of the
# deprecated `serde_yaml`.
[dependencies.serde_yaml_ng]
version = "0.10"
optional = true

[dependencies.argon2]
version = "0.6.0"
optional = true

[dependencies.getrandom]
version = "0.4"
optional = true

# The portal rewrites Authelia's notification emails (`src/portal/mail.rs`):
# it receives them on loopback and relays them through the configured SMTP
# service. `lettre` is the client; rustls + webpki-roots to match the rest of
# the portal's TLS, never native-tls.
#
# 0.11.24 is a security floor: RUSTSEC-2026-0560 to -0565, among them a
# STARTTLS reply injection, and the portal's outbound mail is STARTTLS by
# default.
[dependencies.lettre]
version = "0.11.24"
optional = true
default-features = false
features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"]

[dependencies.async-trait]
version = "0.1"
optional = true

# The viewer portal ships as a SECOND binary rather than a mode of the relay:
# it is public-facing and it is not the data plane, so a bug in it must not be
# able to take the media termination on the same box with it. Declared
# explicitly (and living outside `src/bin/`) so it is not auto-discovered into
# a default build, and gated on `required-features` so `cargo build` without
# the feature simply does not produce it.
[[bin]]
name = "bilbycast-portal"
path = "src/portal_bin.rs"
required-features = ["portal"]

# HTTP client, portal only. The portal is the one component here that CALLS
# something over HTTP — the relay's own manager link is a WebSocket.
#
# `rustls-no-provider`, NOT `rustls`: 0.13 folded the old
# `rustls-tls-webpki-roots` feature away, and plain `rustls` now forces
# aws-lc-rs (a cmake + C build) into a graph that is ring-only. The portal
# ships in the static-musl release variants, whose workflow job installs
# `musl-tools` and nothing else, so aws-lc-sys would not build there.
# `rustls-no-provider` keeps the relay on ring, matching the `rustls` pin
# above, at the cost of having to install the provider and supply the roots
# ourselves — both done in `src/portal/clients.rs`, because reqwest 0.13
# resolves its provider with the STRICT `CryptoProvider::get_default()` (never
# from crate features) and panics when none is installed.
#
# `query` is new here and not optional: `RequestBuilder::query` moved behind
# it in 0.13, and `portal::manager_get` uses it.
[dependencies.reqwest]
version = "0.13.5"
optional = true
default-features = false
# `stream` is for the clip download proxy: a clip is tens of megabytes and the
# portal passes it through rather than holding one per concurrent download.
features = ["json", "query", "rustls-no-provider", "http2", "stream"]

[features]
# OFF by default: a plain `cargo build` produces the pure opaque forwarder with
# zero media-termination surface and no OpenSSL/str0m build dependency.
default = []
viewer-distribution = ["dep:str0m", "dep:tokio-util", "dep:hmac", "dep:tower-http"]
# Release variant: viewer-distribution + statically-vendored OpenSSL, for the
# static-musl release build (no system libssl at build or run time).
viewer-distribution-vendored = ["viewer-distribution", "dep:openssl", "openssl/vendored"]
# The viewer portal binary. Independent of `viewer-distribution` on purpose:
# the portal hands out links to a relay, which need not be this one, and
# building it must not drag in str0m or OpenSSL.
# `accounts` (Authelia user-file sync) needs a YAML parser and an argon2
# hasher; both are portal-only.
portal = ["dep:reqwest", "dep:serde_yaml_ng", "dep:argon2", "dep:getrandom",
          "dep:lettre", "dep:async-trait"]

[dev-dependencies]
tempfile = "3.27.0"
# `test-util` for a paused clock, so a test can run the manager client's
# reconnect loop through its 5 s backoff without waiting for it.
tokio = { version = "1.54.1", features = ["test-util"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

[[test]]
name = "distribution"
required-features = ["viewer-distribution"]

[[test]]
name = "portal"
required-features = ["portal"]

# `statvfs`, for the origin's free-space floor (see `origin::free_bytes`).
# Already in the tree via tokio; declared because the guard calls it directly.
# Unix-only, which the origin already is — it writes a POSIX directory tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
