[package]
name = "bilbycast-relay"
version = "0.16.0"
edition = "2024"
description = "QUIC relay server for bilbycast IP tunneling between NAT'd edge nodes"
license = "AGPL-3.0-or-later"

[lints.clippy]
# Each entry is a deliberate exemption with a reason — do not add one to
# silence a lint you have not looked at. Mirrors the policy blocks in
# bilbycast-edge and bilbycast-manager, and the first three entries are
# adjudicated the same way there.

# Would add `Default` impls that nothing constructs, i.e. dead code — which the
# project bar forbids outright. Both sites (`TunnelStats`, `RelayStats`) are
# built by `new()` at startup and never defaulted. Same call as edge/manager.
new_without_default = "allow"
# Wants `if denom == 0 { 0 } else { numer * 90_000 / denom }` rewritten as
# `checked_div` + `if let`. The guard states "the RTP clock rate is not known
# yet", which is the condition a reader of the WHIP ingest path cares about —
# not "this division might trap". Same reasoning as edge's entry.
manual_checked_ops = "allow"
# Fires on the axum handler-helper shape `Result<(), Response>`, where the
# `Err` variant *is* the HTTP response that gets returned to the client. That
# is the idiomatic axum form; boxing it would add an allocation and an unbox at
# every call site to satisfy a size heuristic aimed at ordinary error enums.
result_large_err = "allow"

[dependencies]
# QUIC
quinn = "0.11.12"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
rcgen = "0.14.10"

# Async runtime
tokio = { version = "1.53.1", features = ["full"] }

# Direct socket-option control for IPV6_V6ONLY on dual-stack QUIC + REST listeners.
socket2 = "0.6.5"

# HTTP API
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["cors"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# CLI
clap = { version = "4.6.7", features = ["derive"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Concurrency
# PINNED to a release candidate on purpose, and the version number is
# misleading: the 7.0 line is STALLED, not merely unreleased. 7.0.0-rc2 was
# published 2025-03-05, there has never been an rc3, and upstream went on to
# publish stable 6.2.1 on 2026-05-17 — fourteen months LATER. No fix will ever
# land on rc2, and an advisory against it would have no upgrade path. It is NOT
# drift; do not "refresh" it to 6.2.1 without doing the attached work.
#
# The requirement is `=7.0.0-rc2`, EXACT, and that matters: a caret on a
# prerelease crosses to later prereleases of the same base version, so plain
# "7.0.0-rc2" would take an rc3 or a 7.0.0 final on the next `cargo update`
# — the routine bump procedure this monorepo uses, since dependabot's cargo
# ecosystem is deliberately off — and land it in the hot-path registries with
# no review. Nothing in [7.0.0-rc2, 8.0.0) has been published since
# 2025-03-05, but the range would have taken it silently.
#
# Reverting to 6.2.1 is API-clean for our usage — every call site is `DashMap`,
# `DashMap::new` or `Entry`, both versions re-export Entry/OccupiedEntry/
# VacantEntry at the crate root, what 7.0 removed (the `Map` trait and
# `SharedValue` — `raw-api` is declared in BOTH versions and was not removed)
# appears nowhere here, and no manifest declares a dashmap feature. The lookup
# bounds on get/remove/contains_key/remove_if do differ — `K: Borrow<Q>, Q:
# Hash + Eq` in 6.2.1 against `Q: Hash + Equivalent<K>` in rc2 — which is
# compile-compatible for our keys only because `equivalent`'s single impl is
# the Borrow blanket. A revert also drags hashbrown 0.14.5 and once_cell into
# three graphs that carry no 0.14.x, and steps back to edition 2018 / MSRV
# 1.65. What stops it being a free swap is that 7.0
# replaced hashbrown's RawTable with HashTable internally, and these maps are
# the lock-free hot-path registries of Key Design Constraints #1/#2. Bench the
# registries before moving, in edge, manager and relay together.
dashmap = "=7.0.0-rc2"

# WebSocket client (manager connection)
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
chrono = { version = "0.4.45", features = ["serde"] }

# Utilities
uuid = { version = "1.26.1", features = ["v4", "serde"] }
anyhow = "1.0.104"
bytes = "1.12.1"

# Certificate pinning (SHA-256 fingerprint)
sha2 = "0.11.0"
hmac = "0.13.0"
webpki-roots = "1.0.9"

# Lock-free cell used by the always-compiled `distribution_control` module (the
# runtime config the manager pushes over WS) + the per-stream keyframe cache.
# Non-optional so the manager-client command handler can hold a
# `DistributionControl` handle without a feature gate. Tiny crate.
arc-swap = "1.9.2"

# ── Viewer distribution subsystem (feature: viewer-distribution, default OFF) ──
# A stateful, media-terminating WHEP SFU + LL-HLS origin co-located in the relay
# binary but hard-isolated from the stateless opaque forwarder. Only pulled in
# when the operator opts a relay into the "distribution" role. The WebRTC stack
# is str0m (same as bilbycast-edge) with the OpenSSL DTLS backend — the pure-Rust
# dimpl DTLS stalls on localhost active↔passive handshakes (see edge Cargo.toml).
[dependencies.str0m]
# 0.24.1, moved in lockstep with bilbycast-edge (both ends of a WHEP session
# must agree). The lockfile moves `str0m` 0.23.1 -> 0.24.1 and `is` 0.11.0 ->
# 0.11.1 and nothing else: `dimpl` 0.7.4 and `sctp-proto` 0.10.5 already met
# the raised floors. MSRV is still 1.85.0, and the `openssl` / `vendored`
# features are unchanged, so `viewer-distribution-vendored` still unifies
# str0m's OpenSSL into the static build. Earlier steps are audited in
# bilbycast-edge/Cargo.toml; the last change that needed code here is still
# `MediaData.data` becoming `Arc<[u8]>` in 0.20.
#
# Correction: 0.23.0 -> 0.23.1 was not dependency-only, as this note used to
# say. It also shipped #1029, bounds checks on malformed SRTP/SRTCP/RTCP/SCTP
# input — parse hardening with nothing to adapt.
#
# 0.23.1 -> 0.24.1 at compile time: no code change. The breaking changes miss
# this crate. `enable_opus` / `enable_pcmu` / ... gained a `use_red` argument
# (RED, #982), and none of them is called here. `BweKind` variants gained named
# fields (#1048), but no BWE is configured and `handle_event` ends in
# `_ => None`. The new `Codec::Red` / `Codec::Tele` variants are not matched,
# and `MediaKind` is still `Audio | Video`. Every builder, SDP, writer and event
# call in `distribution::{webrtc::session, whep, whip_ingest, cascade}` keeps
# its 0.23 signature. The per-media write queue cap rose from 100 to 512 and is
# now ordered by send time; we drain after every write, so it holds one entry.
#
# 0.23.1 -> 0.24.1 in behaviour. All but the first are upstream defaults left
# as they are.
# - Receive reordering now has a deadline by default (#1041/#1057): 2 s for
#   video, 1 s for audio. An incomplete frame at the head of the buffer holds
#   every later frame until it completes or expires, where 30 complete video
#   frames (15 audio) queued behind it used to release it, about 1 s at 30 fps.
#   On WHIP ingest and the cascade pull, a packet lost by a publisher with no
#   NACK/RTX stalled video 2.03 s instead of 1.02 s (measured). So
#   `WebrtcSession::new` sets `set_reordering_timeout_{video,audio}(None)`,
#   restoring count-only release exactly, as the edge does.
# - transport-cc is negotiated per payload type: an answer carries
#   `a=rtcp-fb:<pt> transport-cc` only for a PT the offer gave it to. Checked
#   against `WebrtcSession::accept_offer`: the answer to an ffmpeg-shaped WHIP
#   offer carried it on 0.23.1 and drops it on 0.24.1. Chrome and str0m peers
#   offer it, so their answers keep it. Nothing here runs BWE.
# - SSRC-0 bandwidth probes no longer re-arm an immediate RTCP timeout (#1052),
#   which could spin the session loop on Chrome WHIP ingest.
# - An offer's `a=msid:-` is no longer echoed in the answer (#1060), and stopped
#   m-lines carry no msid or ssrc lines (#1063). RED and telephone-event are
#   opt-in, so answers are otherwise unchanged.
# - `is` 0.11.1 matches the transport protocol when it invalidates a candidate
#   (#1035). A controlled ICE-lite agent now marks a pair Succeeded when it
#   answers a Binding Request (#1039). Only `has_viable_remote_candidate` /
#   `Rtc::accepts` read that state, and neither is called here; controlled-side
#   `evaluate_nomination` still ranks by nomination. `PeerPin` is unaffected.
#
# Not verified live: nothing above has been run against a real browser, ffmpeg
# or OBS peer, or across a 0.23 edge talking to a 0.24 relay (0.24 enables no
# new wire feature by default, so that should work). The evidence is source
# reading, the suites in `tests/distribution.rs` (str0m at both ends) and
# offline SDP probes.
#
# Still true on 0.24.1: the built-in H.264 entries are clamped to level 3.1,
# and `match_h264_score` is byte-identical to 0.23.1, so the level-5.1 block in
# `WebrtcSession::new` stays. KNOWN DEFECT, which predates this bump and is
# unchanged by it: that block makes `accept_offer` panic ("Pt locked multiple
# times: 102") on a recvonly or sendrecv offer whose H.264 PT matches both a
# built-in entry and an extra. A browser WHEP offer is one. It reproduces on
# 0.23.1 and 0.24.1. Tests miss it because their "browser" is another
# `WebrtcSession` with the same extras. It is not fixed here because a fix
# changes the answer SDP and needs its own interop run.
#
# KNOWN GAP, also predating this bump: unlike bilbycast-edge, this crate
# carries no `[patch.crates-io]` and no vendored `is`, so it builds against
# upstream's strict ICE parser (`stun.rs` is byte-identical in 0.11.1). Its
# WHIP ingest therefore REJECTS Binding Requests with no PRIORITY attribute,
# which is what ffmpeg 8.0.x (n8.0 to n8.0.3) sends. ffmpeg 8.1 and later send
# PRIORITY (upstream 7fd967c2c1) and are accepted. Vendoring a permissive parser
# here would also have to replace the unguarded `.expect("STUN request prio")`
# in `is`'s `stun_server_handle_message`, which such a request would then
# reach.
version = "0.24.1"
optional = true
default-features = false
features = ["openssl"]

[dependencies.tokio-util]
version = "0.7.19"
optional = true
# `io` is what turns a `tokio::fs::File` into a response body: a clip is up to
# 256 MiB and the origin must not hold one in memory to hand it out.
features = ["rt", "io"]

# Only pulled in by `viewer-distribution-vendored` (the release variant) to
# statically vendor OpenSSL — feature unification makes str0m's openssl-sys
# vendored too, so the static-musl release binary carries no runtime libssl
# dependency. Local dev uses plain `viewer-distribution` (system OpenSSL, fast).
[dependencies.openssl]
version = "0.10"
optional = true

# Portal account sync (`src/portal/accounts.rs`): reads and rewrites
# Authelia's YAML user file, and gives each new account an argon2id hash of a
# random secret nobody holds. `serde_yaml_ng` is the maintained fork of the
# deprecated `serde_yaml`.
[dependencies.serde_yaml_ng]
version = "0.10"
optional = true

[dependencies.argon2]
version = "0.6.0"
optional = true

[dependencies.getrandom]
version = "0.4"
optional = true

# The portal rewrites Authelia's notification emails (`src/portal/mail.rs`):
# it receives them on loopback and relays them through the configured SMTP
# service. `lettre` is the client; rustls + webpki-roots to match the rest of
# the portal's TLS, never native-tls.
[dependencies.lettre]
version = "0.11"
optional = true
default-features = false
features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"]

[dependencies.async-trait]
version = "0.1"
optional = true

# The viewer portal ships as a SECOND binary rather than a mode of the relay:
# it is public-facing and it is not the data plane, so a bug in it must not be
# able to take the media termination on the same box with it. Declared
# explicitly (and living outside `src/bin/`) so it is not auto-discovered into
# a default build, and gated on `required-features` so `cargo build` without
# the feature simply does not produce it.
[[bin]]
name = "bilbycast-portal"
path = "src/portal_bin.rs"
required-features = ["portal"]

# HTTP client, portal only. The portal is the one component here that CALLS
# something over HTTP — the relay's own manager link is a WebSocket.
#
# `rustls-no-provider`, NOT `rustls`: 0.13 folded the old
# `rustls-tls-webpki-roots` feature away, and plain `rustls` now forces
# aws-lc-rs (a cmake + C build) into a graph that is ring-only. The portal
# ships in the static-musl release variants, whose workflow job installs
# `musl-tools` and nothing else, so aws-lc-sys would not build there.
# `rustls-no-provider` keeps the relay on ring, matching the `rustls` pin
# above, at the cost of having to install the provider and supply the roots
# ourselves — both done in `src/portal/clients.rs`, because reqwest 0.13
# resolves its provider with the STRICT `CryptoProvider::get_default()` (never
# from crate features) and panics when none is installed.
#
# `query` is new here and not optional: `RequestBuilder::query` moved behind
# it in 0.13, and `portal::manager_get` uses it.
[dependencies.reqwest]
version = "0.13.5"
optional = true
default-features = false
# `stream` is for the clip download proxy: a clip is tens of megabytes and the
# portal passes it through rather than holding one per concurrent download.
features = ["json", "query", "rustls-no-provider", "http2", "stream"]

[features]
# OFF by default: a plain `cargo build` produces the pure opaque forwarder with
# zero media-termination surface and no OpenSSL/str0m build dependency.
default = []
viewer-distribution = ["dep:str0m", "dep:tokio-util"]
# Release variant: viewer-distribution + statically-vendored OpenSSL, for the
# static-musl release build (no system libssl at build or run time).
viewer-distribution-vendored = ["viewer-distribution", "dep:openssl", "openssl/vendored"]
# The viewer portal binary. Independent of `viewer-distribution` on purpose:
# the portal hands out links to a relay, which need not be this one, and
# building it must not drag in str0m or OpenSSL.
# `accounts` (Authelia user-file sync) needs a YAML parser and an argon2
# hasher; both are portal-only.
portal = ["dep:reqwest", "dep:serde_yaml_ng", "dep:argon2", "dep:getrandom",
          "dep:lettre", "dep:async-trait"]

[dev-dependencies]
tempfile = "3.27.0"
tokio-util = { version = "0.7.19", features = ["rt"] }

[[test]]
name = "distribution"
required-features = ["viewer-distribution"]

[[test]]
name = "portal"
required-features = ["portal"]

# `statvfs`, for the origin's free-space floor (see `origin::free_bytes`).
# Already in the tree via tokio; declared because the guard calls it directly.
# Unix-only, which the origin already is — it writes a POSIX directory tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
